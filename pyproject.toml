[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hftrainer"
version = "0.2.0"
description = "A config-driven training and inference framework for Hugging Face and native model stacks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "accelerate>=1.2.1,<2",
    "transformers>=4.30,<6",
    "diffusers>=0.20,<1",
    "peft>=0.17,<1",
    "mmengine>=0.7,<1",
    "safetensors>=0.5",
    "datasets>=2.0",
    "numpy>=1.24",
    "Pillow>=9.5",
    "PyYAML>=6",
]

[project.optional-dependencies]
logging = [
    "tensorboard>=2.14",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
dev = [
    "build>=1.2",
    "pytest>=7.4",
    "ruff>=0.8",
]

# LTX packages are pinned to one reviewed upstream source revision. At the time
# of integration, PyPI only carries an older ltx-core/ltx-pipelines line and no
# current ltx-trainer distribution, so an unpinned PyPI requirement would mix
# incompatible APIs. Keep the three URLs on the same commit when upgrading.
ltx-video-inference = [
    # The pinned source imports torch.compiler.nested_compile_region, which is
    # absent from torch 2.7.x despite the upstream package's broad metadata.
    "torch>=2.8,<3",
    "ltx-core @ git+https://github.com/Lightricks/LTX-2.git@400fd31054597515f47125691032c04b1c3ee24e#subdirectory=packages/ltx-core",
    "ltx-pipelines @ git+https://github.com/Lightricks/LTX-2.git@400fd31054597515f47125691032c04b1c3ee24e#subdirectory=packages/ltx-pipelines",
]
ltx-video-train = [
    "torch>=2.8,<3",
    "ltx-core @ git+https://github.com/Lightricks/LTX-2.git@400fd31054597515f47125691032c04b1c3ee24e#subdirectory=packages/ltx-core",
    "ltx-trainer @ git+https://github.com/Lightricks/LTX-2.git@400fd31054597515f47125691032c04b1c3ee24e#subdirectory=packages/ltx-trainer",
]
ltx-video = [
    "torch>=2.8,<3",
    "ltx-core @ git+https://github.com/Lightricks/LTX-2.git@400fd31054597515f47125691032c04b1c3ee24e#subdirectory=packages/ltx-core",
    "ltx-pipelines @ git+https://github.com/Lightricks/LTX-2.git@400fd31054597515f47125691032c04b1c3ee24e#subdirectory=packages/ltx-pipelines",
    "ltx-trainer @ git+https://github.com/Lightricks/LTX-2.git@400fd31054597515f47125691032c04b1c3ee24e#subdirectory=packages/ltx-trainer",
]

[project.scripts]
hftrainer-train = "tools.train:main"
hftrainer-infer = "tools.infer:main"
hftrainer-ltx-infer = "tools.infer_ltx_video:main"
hftrainer-ltx-preprocess = "tools.preprocess_ltx_video:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hftrainer*", "tools*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: startup smoke tests for training and inference entry points",
    "gpu: tests that require CUDA-capable hardware and local pretrained checkpoints",
    "upstream: optional contracts against a pinned external source checkout",
]
