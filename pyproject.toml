[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hftrainer"
version = "0.3.0"
description = "A config-driven training and inference framework with repository-local model implementations"
readme = "README.md"
license-files = [
    "THIRD_PARTY_NOTICES.md",
    "hftrainer/models/ltx_video/LICENSE.ltx-2.x",
    "hftrainer/models/minimax_h3/LICENSE.minimax-h3",
    "hftrainer/models/minimax_h3/LICENSE.apache-2.0",
    "hftrainer/models/minimax_h3/NOTICE.minimax-h3",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "accelerate>=1.2.1,<2",
    "mmengine>=0.7,<1",
    "safetensors>=0.5",
    "datasets>=2.0",
    "numpy>=1.24",
    "Pillow>=9.5",
    "PyYAML>=6",
]

[project.optional-dependencies]
logging = [
    "tensorboard>=2.14",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
dev = [
    "build>=1.2",
    "pytest>=7.4",
    "ruff>=0.8",
]

# LTX's model, pipeline, and trainer source is pinned inside this repository.
# These extras contain only supporting media/runtime libraries; no external
# model-framework or LTX package supplies executable model code.
ltx-video-inference = [
    "torch>=2.8,<3",
    "av>=14,<17",
    "einops>=0.8,<1",
    "scipy>=1.11,<2",
    "tqdm>=4.66,<5",
]
ltx-video-train = [
    "torch>=2.8,<3",
    "torchaudio>=2.8,<3",
    "av>=14,<17",
    "einops>=0.8,<1",
    "pandas>=2.0,<3",
    "pillow-heif>=0.20,<2",
    "pydantic>=2.10,<3",
    "rich>=13,<15",
    "scipy>=1.11,<2",
    "tqdm>=4.66,<5",
    "typer>=0.15,<1",
]
ltx-video = [
    "torch>=2.8,<3",
    "torchaudio>=2.8,<3",
    "av>=14,<17",
    "einops>=0.8,<1",
    "pandas>=2.0,<3",
    "pillow-heif>=0.20,<2",
    "pydantic>=2.10,<3",
    "rich>=13,<15",
    "scipy>=1.11,<2",
    "tqdm>=4.66,<5",
    "typer>=0.15,<1",
]
ltx-video-integrations = [
    "huggingface-hub>=0.28,<2",
    "imageio>=2.35,<3",
    "wandb>=0.19,<1",
]
ltx-video-hdr = [
    "OpenImageIO>=3.0,<4",
    "opencv-python-headless>=4.10,<5",
]

# The executable MiniMax-H3 implementation is local. These extras provide
# only artifact download and media I/O helpers, never an external model stack.
minimax-h3 = [
    "av>=14,<17",
    "huggingface-hub>=0.28,<2",
    "torchaudio>=2.0",
]

[project.scripts]
hftrainer-train = "tools.train:main"
hftrainer-infer = "tools.infer:main"
hftrainer-ltx-infer = "tools.infer_ltx_video:main"
hftrainer-ltx-preprocess = "tools.preprocess_ltx_video:main"

[tool.setuptools]
# All wheel data is declared below.  Keeping manifest-derived package data
# disabled avoids ambiguous package discovery for nested license files.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["hftrainer*", "tools*"]
namespaces = true

[tool.setuptools.package-data]
"hftrainer.models.ltx_video" = ["LICENSE.ltx-2.x", "UPSTREAM.md"]
"hftrainer.models.ltx_video.network.text_encoders.gemma.encoders" = ["prompts/*.txt"]
"hftrainer.models.wan" = ["SOURCES.md"]
"hftrainer.models.minimax_h3" = [
    "LICENSE.apache-2.0",
    "LICENSE.minimax-h3",
    "NOTICE.minimax-h3",
    "UPSTREAM.md",
]
"tools" = ["*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: startup smoke tests for training and inference entry points",
    "gpu: tests that require CUDA-capable hardware and local pretrained checkpoints",
]
