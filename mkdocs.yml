site_name: HF-Trainer
site_description: A config-driven framework with repository-owned model, training, and inference implementations
repo_url: https://github.com/ZeyuLing/HFTrainer
repo_name: ZeyuLing/HFTrainer
docs_dir: docs/en

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Integration: integration.md
  - API Reference: api_reference.md
  - Memory and Precision: memory.md
  - LoRA: lora.md
  - Models:
    - LTX-Video 2.5: models/ltx_video_2_5.md
    - MiniMax-H3: models/minimax_h3.md
  - Distributed Training: distributed.md
  - Experiment Directory: experiment_dir.md
  - Architecture: architecture.md
  - Supported Tasks: tasks.md
  - Comparison: comparison.md
  - Design:
    - Overview: design/index.md
    - ModelBundle: design/model_bundle.md
    - Checkpoint: design/checkpoint.md
    - Hooks: design/hooks.md
    - Multi-Optimizer: design/multi_optimizer.md
    - Dataset: design/dataset.md
    - Evaluation: design/evaluation.md
