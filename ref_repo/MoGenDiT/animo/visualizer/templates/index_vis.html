<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<div class="container-fluid mt-3" style="max-width: 1650px; margin: 0 auto;">
    <!-- 3D可视化区域 -->
    <div class="visualization-container" style="position: relative; width: 100%; height: 80vh; /* 适配高度 */">
        <div class="d-flex justify-content-center" id="vis3d" style="width: 100%; height: 100%; position: relative;">
            <!-- Canvas画布 -->
            <canvas id="scene-canvas" style="width: 100%; height: 100%; border-radius: 8px;"></canvas>

            <!-- 动捕启停按钮（嵌入Canvas内，左上角） -->
            <button class="control-btn mocap-switch-btn" id="mocapSwitchBtn" onclick="switchMocapState()"
                title="启动/停止动捕" style="position: absolute; top: 20px; left: 20px; z-index: 100;">
                <i class="fas fa-play"></i>
                <span class="btn-text">启动动捕</span>
            </button>

            <!-- 视角切换按钮（嵌入Canvas内，右上角） -->
            <button class="control-btn camera-btn" id="cameraSwitchBtn" onclick="toggleCameraMode()" title="切换正交/透视视角"
                style="position: absolute; top: 20px; right: 20px; z-index: 100;">
                <i class="fas fa-cube"></i>
            </button>
        </div>

        <!-- 播放控制区域（保留原有） -->
        <div class="controls-container">
            <div class="controls-row">
                <div class="playback-controls">
                    <!-- 移除原有视角按钮，已嵌入Canvas内 -->
                </div>
            </div>
        </div>
    </div>
</div>
