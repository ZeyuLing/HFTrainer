<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js三维棋盘格场景</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }

        header {
            padding: 20px;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            background: linear-gradient(to right, #7ee8fa, #eec0c6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: #a0a0c0;
            font-size: 1.1rem;
        }

        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .scene-container {
            flex: 1;
            position: relative;
        }

        #scene-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-panel {
            width: 300px;
            background-color: rgba(0, 0, 0, 0.4);
            padding: 20px;
            overflow-y: auto;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-section {
            margin-bottom: 25px;
        }

        .control-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #7ee8fa;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(126, 232, 250, 0.3);
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #c0c0e0;
        }

        .slider-container {
            display: flex;
            align-items: center;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #7ee8fa;
            cursor: pointer;
        }

        .value-display {
            width: 40px;
            text-align: center;
            margin-left: 10px;
            color: #7ee8fa;
            font-weight: bold;
        }

        .instructions {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .instructions h3 {
            color: #eec0c6;
            margin-bottom: 10px;
        }

        .instructions ul {
            padding-left: 20px;
        }

        .instructions li {
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 10px 15px;
            background: linear-gradient(to right, #4a6fa5, #6a93cb);
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        button.reset {
            background: linear-gradient(to right, #d16ba5, #c777b9);
        }

        .scene-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 100;
        }

        .loading.hidden {
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #7ee8fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }

            .controls-panel {
                width: 100%;
                height: 300px;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Three.js 三维棋盘格场景</h1>
            <p class="subtitle">通过鼠标拖拽、滚轮调整视角，探索三维空间</p>
        </header>

        <div class="content">
            <div class="scene-container">
                <div id="loading" class="loading">
                    <div class="spinner"></div>
                </div>
                <canvas id="scene-canvas"></canvas>
                <div class="scene-info">
                    <div>棋盘格尺寸: 20x20</div>
                    <div>方块大小: 1单位</div>
                </div>
            </div>

            <div class="controls-panel">
                <div class="control-section">
                    <h3 class="control-title">视角控制</h3>

                    <div class="control-group">
                        <label>旋转速度</label>
                        <div class="slider-container">
                            <input type="range" id="rotate-speed" min="0.1" max="2" step="0.1" value="1">
                            <span class="value-display" id="rotate-speed-value">1.0</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>缩放速度</label>
                        <div class="slider-container">
                            <input type="range" id="zoom-speed" min="0.5" max="3" step="0.1" value="1">
                            <span class="value-display" id="zoom-speed-value">1.0</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>棋盘格颜色1</label>
                        <div class="slider-container">
                            <input type="color" id="color1" value="#4a6fa5">
                        </div>
                    </div>

                    <div class="control-group">
                        <label>棋盘格颜色2</label>
                        <div class="slider-container">
                            <input type="color" id="color2" value="#2c3e50">
                        </div>
                    </div>

                    <div class="btn-group">
                        <button id="reset-view">重置视角</button>
                        <button id="add-object" class="reset">添加物体</button>
                    </div>
                </div>

                <div class="control-section">
                    <h3 class="control-title">场景控制</h3>

                    <div class="control-group">
                        <label>棋盘格尺寸</label>
                        <div class="slider-container">
                            <input type="range" id="grid-size" min="5" max="30" step="1" value="20">
                            <span class="value-display" id="grid-size-value">20</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>环境光强度</label>
                        <div class="slider-container">
                            <input type="range" id="ambient-light" min="0" max="1" step="0.1" value="0.5">
                            <span class="value-display" id="ambient-light-value">0.5</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>方向光强度</label>
                        <div class="slider-container">
                            <input type="range" id="directional-light" min="0" max="2" step="0.1" value="1">
                            <span class="value-display" id="directional-light-value">1.0</span>
                        </div>
                    </div>
                </div>

                <div class="instructions">
                    <h3>操作说明</h3>
                    <ul>
                        <li><strong>鼠标左键拖拽</strong>: 旋转视角</li>
                        <li><strong>鼠标右键拖拽</strong>: 平移场景</li>
                        <li><strong>鼠标滚轮</strong>: 缩放视图</li>
                        <li><strong>双击物体</strong>: 聚焦到物体</li>
                        <li>使用右侧面板调整场景参数</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 等待DOM加载完成
        document.addEventListener('DOMContentLoaded', () => {
            // 获取Canvas元素
            const canvas = document.getElementById('scene-canvas');

            // 创建Three.js场景
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a192f);

            // 创建相机
            const camera = new THREE.PerspectiveCamera(
                75,
                canvas.clientWidth / canvas.clientHeight,
                0.1,
                1000
            );
            camera.position.set(15, 15, 15);

            // 创建渲染器
            const renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: true
            });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // 创建轨道控制器
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = true;
            controls.maxPolarAngle = Math.PI / 2; // 限制不能看到地面以下

            // 隐藏加载界面
            document.getElementById('loading').classList.add('hidden');

            // 初始化变量
            let gridHelper;
            let gridSize = 20;
            let color1 = 0x4a6fa5;
            let color2 = 0x2c3e50;
            let addedObjects = [];

            // 创建棋盘格地面
            function createCheckerboardGround(size, color1, color2) {
                // 移除旧的网格
                if (gridHelper) {
                    scene.remove(gridHelper);
                    gridHelper.geometry.dispose();
                    gridHelper.material.dispose();
                }

                // 创建棋盘格地面
                const groundGeometry = new THREE.PlaneGeometry(size, size, size, size);
                const groundMaterial = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    side: THREE.DoubleSide,
                    vertexColors: true
                });

                // 创建颜色数组
                const colors = [];
                const color1Vec = new THREE.Color(color1);
                const color2Vec = new THREE.Color(color2);

                for (let i = 0; i <= size; i++) {
                    for (let j = 0; j <= size; j++) {
                        // 棋盘格模式
                        const color = (i + j) % 2 === 0 ? color1Vec : color2Vec;

                        // 每个顶点有4个副本（一个四边形）
                        for (let k = 0; k < 4; k++) {
                            colors.push(color.r, color.g, color.b);
                        }
                    }
                }

                // 设置顶点颜色
                groundGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

                const ground = new THREE.Mesh(groundGeometry, groundMaterial);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;

                scene.add(ground);
                gridHelper = ground;

                // 添加网格线
                const gridLines = new THREE.GridHelper(size, size, 0x000000, 0x000000);
                gridLines.material.opacity = 0.2;
                gridLines.material.transparent = true;
                scene.add(gridLines);
            }

            // 创建灯光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(10, 20, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.left = -20;
            directionalLight.shadow.camera.right = 20;
            directionalLight.shadow.camera.top = 20;
            directionalLight.shadow.camera.bottom = -20;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // 添加一些3D物体到场景中
            function addRandomObject() {
                const objectTypes = ['sphere', 'cube', 'cylinder', 'cone', 'torus'];
                const type = objectTypes[Math.floor(Math.random() * objectTypes.length)];

                let geometry, material;
                const color = new THREE.Color(
                    Math.random() * 0.5 + 0.5,
                    Math.random() * 0.5 + 0.5,
                    Math.random() * 0.5 + 0.5
                );

                switch (type) {
                    case 'sphere':
                        geometry = new THREE.SphereGeometry(1, 16, 16);
                        break;
                    case 'cube':
                        geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
                        break;
                    case 'cylinder':
                        geometry = new THREE.CylinderGeometry(0.8, 0.8, 2, 16);
                        break;
                    case 'cone':
                        geometry = new THREE.ConeGeometry(1, 2, 16);
                        break;
                    case 'torus':
                        geometry = new THREE.TorusGeometry(1, 0.4, 16, 32);
                        break;
                }

                material = new THREE.MeshStandardMaterial({
                    color: color,
                    roughness: 0.4,
                    metalness: 0.1
                });

                const object = new THREE.Mesh(geometry, material);
                object.castShadow = true;
                object.receiveShadow = true;

                // 随机位置
                const x = (Math.random() - 0.5) * (gridSize - 4);
                const z = (Math.random() - 0.5) * (gridSize - 4);
                object.position.set(x, 1, z);

                // 随机旋转
                object.rotation.x = Math.random() * Math.PI;
                object.rotation.y = Math.random() * Math.PI;

                scene.add(object);
                addedObjects.push(object);

                // 添加点击事件
                object.userData.clickable = true;

                return object;
            }

            // 初始化添加几个物体
            for (let i = 0; i < 5; i++) {
                addRandomObject();
            }

            // 创建坐标系辅助
            const axesHelper = new THREE.AxesHelper(5);
            scene.add(axesHelper);

            // 初始创建棋盘格
            createCheckerboardGround(gridSize, color1, color2);

            // 动画循环
            function animate() {
                requestAnimationFrame(animate);

                // 更新控制器
                controls.update();

                // 旋转添加的物体
                addedObjects.forEach(obj => {
                    obj.rotation.y += 0.01;
                });

                // 渲染场景
                renderer.render(scene, camera);
            }

            animate();

            // 窗口大小调整处理
            window.addEventListener('resize', () => {
                camera.aspect = canvas.clientWidth / canvas.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            });

            // 控制面板事件处理
            document.getElementById('rotate-speed').addEventListener('input', function () {
                const value = parseFloat(this.value);
                controls.rotateSpeed = value;
                document.getElementById('rotate-speed-value').textContent = value.toFixed(1);
            });

            document.getElementById('zoom-speed').addEventListener('input', function () {
                const value = parseFloat(this.value);
                controls.zoomSpeed = value;
                document.getElementById('zoom-speed-value').textContent = value.toFixed(1);
            });

            document.getElementById('color1').addEventListener('input', function () {
                color1 = parseInt(this.value.substring(1), 16);
                createCheckerboardGround(gridSize, color1, color2);
            });

            document.getElementById('color2').addEventListener('input', function () {
                color2 = parseInt(this.value.substring(1), 16);
                createCheckerboardGround(gridSize, color1, color2);
            });

            document.getElementById('grid-size').addEventListener('input', function () {
                gridSize = parseInt(this.value);
                document.getElementById('grid-size-value').textContent = gridSize;
                createCheckerboardGround(gridSize, color1, color2);
            });

            document.getElementById('ambient-light').addEventListener('input', function () {
                const value = parseFloat(this.value);
                ambientLight.intensity = value;
                document.getElementById('ambient-light-value').textContent = value.toFixed(1);
            });

            document.getElementById('directional-light').addEventListener('input', function () {
                const value = parseFloat(this.value);
                directionalLight.intensity = value;
                document.getElementById('directional-light-value').textContent = value.toFixed(1);
            });

            document.getElementById('reset-view').addEventListener('click', function () {
                controls.reset();
                camera.position.set(15, 15, 15);
                controls.update();
            });

            document.getElementById('add-object').addEventListener('click', function () {
                addRandomObject();
            });

            // 添加鼠标双击选择物体功能
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            canvas.addEventListener('dblclick', (event) => {
                // 计算鼠标在归一化设备坐标中的位置
                const rect = canvas.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / canvas.clientHeight) * 2 + 1;

                // 更新射线的起点和方向
                raycaster.setFromCamera(mouse, camera);

                // 计算与哪些物体相交
                const intersects = raycaster.intersectObjects(scene.children.filter(obj => obj.userData.clickable));

                if (intersects.length > 0) {
                    const object = intersects[0].object;

                    // 将相机聚焦到选中的物体
                    const focusPoint = object.position.clone();
                    const direction = new THREE.Vector3().subVectors(camera.position, focusPoint).normalize();
                    const newPosition = focusPoint.clone().add(direction.multiplyScalar(10));

                    // 平滑过渡到新位置
                    new TWEEN.Tween(camera.position)
                        .to(newPosition, 1000)
                        .easing(TWEEN.Easing.Quadratic.Out)
                        .start();

                    controls.target.copy(focusPoint);
                    controls.update();
                }
            });

            // 初始化控制面板显示值
            document.getElementById('rotate-speed-value').textContent =
                document.getElementById('rotate-speed').value;
            document.getElementById('zoom-speed-value').textContent =
                document.getElementById('zoom-speed').value;
            document.getElementById('grid-size-value').textContent =
                document.getElementById('grid-size').value;
            document.getElementById('ambient-light-value').textContent =
                document.getElementById('ambient-light').value;
            document.getElementById('directional-light-value').textContent =
                document.getElementById('directional-light').value;

            // 添加Tween.js用于平滑动画
            const TWEEN = (function () {
                class Tween {
                    constructor(object) {
                        this._object = object;
                        this._to = {};
                        this._duration = 1000;
                        this._easing = TWEEN.Easing.Linear.None;
                    }

                    to(properties, duration) {
                        this._to = properties;
                        if (duration !== undefined) this._duration = duration;
                        return this;
                    }

                    easing(easing) {
                        this._easing = easing;
                        return this;
                    }

                    start() {
                        const startTime = Date.now();
                        const startValues = {};

                        for (const prop in this._to) {
                            startValues[prop] = this._object[prop];
                        }

                        const animate = () => {
                            const now = Date.now();
                            const elapsed = now - startTime;
                            const t = Math.min(elapsed / this._duration, 1);

                            const easedT = this._easing(t);

                            for (const prop in this._to) {
                                this._object[prop] = startValues[prop] +
                                    (this._to[prop] - startValues[prop]) * easedT;
                            }

                            if (t < 1) {
                                requestAnimationFrame(animate);
                            }
                        };

                        requestAnimationFrame(animate);
                        return this;
                    }
                }

                TWEEN.Easing = {
                    Linear: {
                        None: function (k) { return k; }
                    },
                    Quadratic: {
                        Out: function (k) { return k * (2 - k); }
                    }
                };

                return { Tween };
            })();
        });
    </script>
</body>

</html>
